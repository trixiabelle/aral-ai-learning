<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="ARAL AI — an AI-assisted personalized learning prototype for students.">
  <title>ARAL AI | Learning Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <header id="topbar" class="topbar hidden">
      <button class="brand-button" data-action="go-dashboard" aria-label="Go to dashboard">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>
          <strong>ARAL<span> AI</span></strong>
          <small>Learning Companion</small>
        </span>
      </button>

      <nav class="desktop-nav" aria-label="Main navigation">
        <button data-action="go-dashboard" class="nav-link">Dashboard</button>
        <button data-action="go-learning" class="nav-link">Learn</button>
        <button data-action="go-results" class="nav-link">Results</button>
      </nav>

      <div class="topbar-actions">
        <div class="student-chip">
          <span class="avatar" id="nav-avatar">S</span>
          <span id="nav-student-name">Student</span>
        </div>
        <button class="icon-button" data-action="toggle-mobile-menu" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </header>

    <div id="mobile-menu" class="mobile-menu hidden">
      <button data-action="go-dashboard">Dashboard</button>
      <button data-action="go-learning">Learn</button>
      <button data-action="go-results">Results</button>
      <button data-action="logout">Log out</button>
    </div>

    <main id="main" tabindex="-1"></main>
  </div>

  <noscript>
    <div class="noscript">ARAL AI requires JavaScript to run. Please enable JavaScript in your browser.</div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
